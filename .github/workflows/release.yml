name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check npm publication
        id: npm
        shell: bash
        run: |
          set +e
          node scripts/check-npm-version.mjs \
            "${{ steps.pkg.outputs.name }}" \
            "${{ steps.pkg.outputs.version }}"
          status=$?
          set -e

          case "$status" in
            0) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Check GitHub release
        id: github-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether release work is needed
        id: release-needed
        shell: bash
        run: |
          if [[ "${{ steps.npm.outputs.exists }}" == "false" || "${{ steps.github-release.outputs.exists }}" == "false" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.release-needed.outputs.needed == 'true'
        with:
          bun-version: "1.3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.release-needed.outputs.needed == 'true'
        with:
          node-version: "24"

      - name: Install OIDC-capable npm
        if: steps.release-needed.outputs.needed == 'true'
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        if: steps.release-needed.outputs.needed == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build the release artifact
        if: steps.release-needed.outputs.needed == 'true'
        run: |
          bun run clean:all
          bun run build
          bun run package:pack

      - name: Validate the exact tarball
        if: steps.release-needed.outputs.needed == 'true'
        run: |
          bun run check:architecture
          bun run size:check
          bun run package:validate
          bun run package:consumers

      - name: Generate SPDX SBOM
        if: steps.release-needed.outputs.needed == 'true'
        shell: bash
        run: npm sbom --sbom-format=spdx --omit=dev > .artifacts/sbom.spdx.json

      - name: Publish exact validated tarball with npm OIDC
        if: steps.release-needed.outputs.needed == 'true' && steps.npm.outputs.exists == 'false'
        shell: bash
        run: |
          # Trusted Publishing must not inherit setup-node's classic token auth.
          unset NODE_AUTH_TOKEN
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "$NPM_CONFIG_USERCONFIG" ]]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
          npm publish .artifacts/package.tgz --access public --ignore-scripts

      - name: Extract release notes
        if: steps.release-needed.outputs.needed == 'true'
        id: changelog
        shell: bash
        run: |
          node scripts/extract-release-notes.mjs \
            "${{ steps.pkg.outputs.version }}" \
            .artifacts/release-notes.md
          echo "notes_file=.artifacts/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        if: steps.release-needed.outputs.needed == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: "v${{ steps.pkg.outputs.version }}"
          name: "v${{ steps.pkg.outputs.version }}"
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: |
            .artifacts/package.tgz
            .artifacts/package.sha256
            .artifacts/sbom.spdx.json
